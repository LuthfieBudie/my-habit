<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">

    <!-- PWA: supaya bisa di-install jadi aplikasi di HP -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="My Habit">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/checkin.css">
    <title>Check-in · My Habit</title>

    <!-- pasang tema SEBELUM halaman tampil, supaya tidak berkedip -->
    <script>
        document.documentElement.dataset.theme = localStorage.getItem("ciTheme") || "dark";
    </script>
</head>
<body>
    <!-- ===== HEADER ===== -->
    <header class="ci-top">
        <a href="index.html" class="ci-round" title="Back to dashboard">‹</a>
        <h1>Habits</h1>
        <div class="ci-actions">
            <!-- ganti tema dark / light -->
            <button class="ci-round ci-theme" id="themeBtn" title="Switch theme">
                <svg class="ikon-bulan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <svg class="ikon-matahari" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button class="ci-add" id="addBtn" title="Add habit"><span class="ci-add-text">Add</span> <span class="ci-plus">+</span></button>
        </div>
    </header>

    <!-- ringkasan hari ini -->
    <section class="ci-summary">
        <span id="todayLabel"></span>
        <div class="ci-progress"><i id="progressBar"></i></div>
        <b id="progressText">0 / 0</b>
    </section>

    <!-- muncul saat laptop tidak bisa dihubungi / masih ada perubahan yang belum terkirim -->
    <div class="ci-offline" id="offlineBar" role="status"></div>

    <main class="ci-main">
        <h2 class="ci-section">Habits</h2>
        <div class="ci-grid" id="habitGrid"></div>

        <h2 class="ci-section">Schedule</h2>
        <div class="ci-grid" id="scheduleGrid"></div>
    </main>

    <!-- ===== DETAIL HABIT (muncul saat kartu diketuk) ===== -->
    <div class="ci-detail" id="detail">
        <div class="ci-detail-box" id="detailBox">
            <header class="ci-detail-head">
                <button class="ci-round" id="editBtn" title="Edit habit">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
                </button>
                <h2 class="ci-detail-name"><i class="ci-dot"></i><span id="detailName"></span></h2>
                <button class="ci-round" id="closeDetail" title="Close">✕</button>
            </header>

            <!-- heatmap besar: 20 minggu, bisa mundur / maju -->
            <section class="ci-big">
                <div class="ci-big-body">
                    <div class="ci-days">
                        <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
                    </div>
                    <div class="ci-heat ci-heat-big" id="detailHeat"></div>
                </div>
                <div class="ci-big-foot">
                    <button class="ci-round small" id="olderBtn" title="Older">‹</button>
                    <span id="detailRange"></span>
                    <button class="ci-round small" id="newerBtn" title="Newer">›</button>
                </div>
            </section>

            <!-- 4 angka ringkasan -->
            <div class="ci-stats">
                <div class="ci-stat">
                    <span class="ci-stat-title">🔥 Streak</span>
                    <b class="ci-stat-value" id="statStreak">0</b>
                    <span class="ci-stat-foot" id="statStreakFoot"></span>
                </div>
                <div class="ci-stat">
                    <span class="ci-stat-title">✅ Total Check-Ins</span>
                    <b class="ci-stat-value" id="statTotal">0</b>
                    <span class="ci-stat-foot" id="statTotalFoot"></span>
                </div>
                <div class="ci-stat">
                    <span class="ci-stat-title">🕒 Avg. Log Time</span>
                    <b class="ci-stat-value" id="statTime">–</b>
                    <span class="ci-stat-foot" id="statTimeFoot"></span>
                </div>
                <div class="ci-stat">
                    <span class="ci-stat-title">🏆 Goal Progress</span>
                    <b class="ci-stat-value" id="statGoal">0%</b>
                    <div class="ci-stat-bar"><i id="statGoalBar"></i></div>
                    <span class="ci-stat-foot" id="statGoalFoot"></span>
                </div>
            </div>

            <!-- riwayat check-in -->
            <h3 class="ci-records-title">Records</h3>
            <div id="records"></div>
        </div>
    </div>

    <!-- ===== MODAL TAMBAH / EDIT HABIT ===== -->
    <div class="ci-modal" id="addModal">
        <form class="ci-sheet" id="addForm">
            <div class="ci-sheet-head">
                <h3 id="addTitle">New habit</h3>
                <button type="button" class="ci-round small" id="closeAdd">✕</button>
            </div>

            <label class="ci-label" for="addName">Name</label>
            <input type="text" id="addName" maxlength="100" placeholder="e.g. Drink water">

            <span class="ci-label">Schedule</span>
            <p class="ci-note" id="rangeNote">Date range — change it on the dashboard</p>
            <div class="ci-seg" id="scheduleSeg">
                <label><input type="radio" name="addSchedule" value="everyday" checked><span>Everyday</span></label>
                <label><input type="radio" name="addSchedule" value="weekday"><span>Weekday</span></label>
                <label><input type="radio" name="addSchedule" value="per_week"><span>X / week</span></label>
                <label><input type="radio" name="addSchedule" value="once"><span>Once</span></label>
            </div>

            <div class="ci-extra" id="perWeekBox">
                <input type="number" id="addTimes" min="1" max="7" value="3"> <span>times per week</span>
            </div>
            <div class="ci-extra" id="onceBox">
                <input type="date" id="addDate">
            </div>

            <span class="ci-label">Priority</span>
            <div class="ci-seg">
                <label><input type="radio" name="addPriority" value="crucial"><span>Critical</span></label>
                <label><input type="radio" name="addPriority" value="important"><span>Important</span></label>
                <label><input type="radio" name="addPriority" value="normal" checked><span>Routine</span></label>
            </div>

            <p class="ci-error" id="addError"></p>
            <button type="submit" class="ci-save">Save</button>
        </form>
    </div>

    <!-- localapi.js PALING DULU: menjawab semua fetch("/api/...") dari penyimpanan perangkat -->
    <script src="static/localapi.js"></script>
    <script src="static/pwa.js"></script>
    <script src="static/offline.js"></script>
    <script src="static/checkin.js"></script>
    <script src="static/sync.js"></script>
</body>
</html>
