# =====================================================
# GitHub membuat "My Habit.exe" otomatis (gratis, di komputer Windows milik GitHub)
#   - tombol "Run workflow" di tab Actions → hasilnya bisa di-download dari halaman run
#   - push tag (misalnya v1.0) → .exe otomatis dilampirkan ke halaman Releases
# =====================================================
name: Build My Habit.exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install pyinstaller pywebview pillow

      - name: Siapkan login Google (dari Secrets)
        shell: python
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          import json, os
          data = {"client_id": os.environ.get("GOOGLE_DESKTOP_CLIENT_ID", ""), "client_secret": os.environ.get("GOOGLE_DESKTOP_CLIENT_SECRET", "")}
          json.dump(data, open("oauth_desktop.json", "w"))
          print("Login Google:", "aktif" if data["client_id"] else "BELUM diisi (tombol Sign in akan menampilkan pesan)")

      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "My Habit" --icon "docs/static/icons/icon-512.png" --add-data "docs;docs" --add-data "oauth_desktop.json;." desktop.py

      - name: Upload exe (download dari halaman run ini)
        uses: actions/upload-artifact@v4
        with:
          name: My-Habit-Windows
          path: dist/My Habit.exe

      - name: Lampirkan ke Release (kalau dari tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/My Habit.exe
